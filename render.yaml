services:
  - type: web
    name: thrunox-redesign
    runtime: static
    buildCommand: mkdir -p dist && cp -r index.html logo*.png images *.pdf dist/ 2>/dev/null || true
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
