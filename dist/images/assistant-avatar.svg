<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaedf1"/>
      <stop offset="100%" stop-color="#cfd5dd"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fad0c4"/>
      <stop offset="100%" stop-color="#ffd1ba"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1c15"/>
      <stop offset="100%" stop-color="#140c09"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="#c89641" stroke-width="2.5"/>

  <!-- Back Hair -->
  <ellipse cx="60" cy="56" rx="30" ry="34" fill="url(#hairGrad)"/>
  <path d="M30 65 Q 26 95 38 105 Q 48 95 46 75 Z" fill="url(#hairGrad)"/>
  <path d="M90 65 Q 94 95 82 105 Q 72 95 74 75 Z" fill="url(#hairGrad)"/>

  <!-- Neck & Collarbone -->
  <rect x="52" y="68" width="16" height="18" rx="4" fill="url(#skinGrad)"/>
  <path d="M52 74 Q 60 78 68 74" fill="none" stroke="#e0a899" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Corporate Blazer / Suit -->
  <path d="M26 116 Q 30 84 50 82 L 60 98 L 70 82 Q 90 84 94 116 Z" fill="url(#suitGrad)" filter="url(#softShadow)"/>
  <!-- White Inner Shirt / Blouse -->
  <polygon points="52,82 68,82 60,98" fill="#ffffff"/>
  <!-- Gold Corporate Lapel Pin -->
  <circle cx="44" cy="92" r="3" fill="url(#goldGrad)" stroke="#8c5d14" stroke-width="0.7"/>

  <!-- Head / Face -->
  <ellipse cx="60" cy="52" rx="20" ry="24" fill="url(#skinGrad)"/>
  <!-- Ears -->
  <ellipse cx="39" cy="54" rx="3.5" ry="5.5" fill="url(#skinGrad)"/>
  <ellipse cx="81" cy="54" rx="3.5" ry="5.5" fill="url(#skinGrad)"/>
  <!-- Small Pearl Earrings -->
  <circle cx="38" cy="56" r="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <circle cx="82" cy="56" r="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>

  <!-- Eyes & Eyebrows -->
  <path d="M46 44 Q 51 42 56 44" fill="none" stroke="#2d1c15" stroke-width="2" stroke-linecap="round"/>
  <path d="M64 44 Q 69 42 74 44" fill="none" stroke="#2d1c15" stroke-width="2" stroke-linecap="round"/>
  
  <ellipse cx="51" cy="49" rx="3.5" ry="4" fill="#2d1c15"/>
  <circle cx="52.2" cy="47.8" r="1.2" fill="#ffffff"/>
  
  <ellipse cx="69" cy="49" rx="3.5" ry="4" fill="#2d1c15"/>
  <circle cx="70.2" cy="47.8" r="1.2" fill="#ffffff"/>

  <!-- Eyelashes -->
  <path d="M47 46 Q 51 44 55 46" fill="none" stroke="#140c09" stroke-width="1.2"/>
  <path d="M65 46 Q 69 44 73 46" fill="none" stroke="#140c09" stroke-width="1.2"/>

  <!-- Nose -->
  <path d="M60 51 Q 61 56 59 58 Q 61 59 63 58" fill="none" stroke="#d99b8b" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Cheeks Blush -->
  <ellipse cx="46" cy="56" rx="4" ry="2.2" fill="#f43f5e" opacity="0.18"/>
  <ellipse cx="74" cy="56" rx="4" ry="2.2" fill="#f43f5e" opacity="0.18"/>

  <!-- Warm Smile -->
  <path d="M53 63 Q 60 70 67 63" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
  <!-- Lip Color Fill -->
  <path d="M54 63 Q 60 67 66 63 Q 60 69 54 63 Z" fill="#e11d48" opacity="0.75"/>

  <!-- Front Hair / Bangs -->
  <path d="M40 46 Q 42 26 60 26 Q 78 26 80 46 Q 68 34 60 38 Q 48 32 40 46 Z" fill="url(#hairGrad)"/>
  <path d="M40 45 Q 46 36 56 38 Q 48 44 42 52 Z" fill="url(#hairGrad)"/>
  <path d="M80 45 Q 74 36 64 38 Q 72 44 78 52 Z" fill="url(#hairGrad)"/>

  <!-- Headset Microphone (Support / Assistant Element) -->
  <path d="M37 50 Q 36 34 50 30" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="34" y="47" width="5" height="10" rx="2" fill="#334155"/>
  <path d="M36 55 Q 38 72 52 70" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="52" cy="70" r="2.5" fill="#c89641"/>

  <!-- Online Green Status Indicator -->
  <circle cx="94" cy="94" r="8" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
</svg>
